<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}WF research{% endblock %} · Local research</title>
<style>
:root{color-scheme:light;--ink:#183332;--muted:#526766;--line:#cdd9d4;--paper:#f5f4ed;--accent:#21665d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,sans-serif}
a{color:var(--accent);text-underline-offset:3px}a:hover{color:#123e37}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #d79138;outline-offset:3px}
header{background:#183332;color:white;padding:18px 5%;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}header a{color:white}header strong{letter-spacing:.03em}nav{display:flex;gap:20px;align-items:center;flex-wrap:wrap}nav form{margin:0}
main{max-width:1500px;margin:auto;padding:32px 5% 60px}h1{font:600 clamp(25px,3vw,38px)/1.2 Georgia,serif;margin:10px 0 16px}h2{font-size:20px}h3{font-size:17px;margin:0 0 10px}.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.muted{color:var(--muted)}.notice{border-left:4px solid #bd853a;background:#fff6df;padding:12px 16px;margin:20px 0}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}.grid .card{margin:0;padding:16px}.image-link{display:block;background:#f0f2ef;border:1px solid var(--line)}.image-link img{display:block;width:100%;height:320px;object-fit:contain}.locator{font-size:14px;margin:12px 0 5px}.badge{display:inline-block;border-radius:20px;background:#e4efeb;padding:3px 10px;font-size:13px}.rejected{background:#f6e2dc}.unresolved{background:#fff0ce}dl{display:grid;grid-template-columns:130px 1fr;gap:8px}dt{font-weight:600}dd{margin:0;overflow-wrap:anywhere}button,.button{font:inherit;background:var(--accent);color:white;padding:9px 16px;border:0;border-radius:5px;cursor:pointer;text-decoration:none}nav button{background:none;border:1px solid #7a9b97;padding:4px 12px}input{display:block;width:100%;font:inherit;border:1px solid #849d98;border-radius:4px;padding:10px;margin:5px 0 18px}label{font-weight:600}.login{max-width:440px;margin:55px auto}.errorlist{color:#962e24}.history{font-size:14px}summary{cursor:pointer;font-weight:600}footer{padding:24px 5%;color:var(--muted);border-top:1px solid var(--line);font-size:13px}
textarea,select{display:block;width:100%;max-width:100%;font:inherit;border:1px solid #849d98;border-radius:4px;padding:10px;margin:5px 0 18px}textarea:focus-visible,select:focus-visible{outline:3px solid #d79138;outline-offset:3px}.review-form{max-width:850px}.review-form input[type=checkbox]{display:inline;width:auto;margin:0 8px 0 0}.helptext{display:block;color:var(--muted);font-size:14px}.card{overflow-wrap:anywhere}
.ocr-text{white-space:pre-wrap;overflow-wrap:anywhere}.citation-figure{position:relative;width:100%;max-width:1000px;margin:24px 0;background:white}.citation-figure img{display:block;width:100%;height:auto}.citation-region{position:absolute;border:3px solid #b95f00;box-shadow:0 0 0 1px white;pointer-events:none}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:850px){.grid{grid-template-columns:1fr}.image-link img{height:auto;max-height:520px}main{padding:24px 5%}dl{grid-template-columns:1fr;gap:3px}dd{margin-bottom:8px}}
</style></head><body>
<header><strong>WF research</strong><nav>{% if user.is_authenticated %}<a href="{% url 'index' %}">Cases</a><a href="{% url 'admin:index' %}">Administration</a><span>{{ user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Log out</button></form>{% else %}<span>Synthetic pilot</span>{% endif %}</nav></header>
<main>{% for message in messages %}<div class="notice" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>Local research only · Catalogue metadata is not adopted</footer>
</body></html>
