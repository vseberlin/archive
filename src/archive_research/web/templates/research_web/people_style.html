<style>
main{max-width:1800px;padding:18px 24px 40px}header{padding:12px 24px}footer{padding:12px 24px}
.pr-heading{display:flex;justify-content:space-between;align-items:center;gap:20px}.pr-heading h1{font-size:28px;margin:5px 0}.pr-heading p{margin:4px 0;font-size:13px}
.pr-modes{display:flex;gap:18px;padding:15px 0;font-size:14px}.pr-modes a[aria-current]{font-weight:700;border-bottom:2px solid var(--accent)}

.pr-evidence{border:1px solid var(--line);border-radius:7px;padding:12px;margin:12px 0;font-size:12px}.pr-evidence p{margin:8px 0}.pr-evidence img{display:block;max-width:100%;max-height:330px;object-fit:contain;margin:8px auto}.pr-evidence figure{margin:8px 0}.pr-evidence summary{font-size:12px}.pr-evidence dl{grid-template-columns:110px 1fr;font-size:12px}.pr-evidence details{padding:6px 0}.pr-source-tabs{display:flex;gap:5px;padding:8px 0}.pr-source-tabs button{font-size:11px;padding:5px 8px;background:#e9efea;color:var(--ink)}
