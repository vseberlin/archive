[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iss-archive-research"
version = "0.1.0"
description = "Bound source, page and result contracts for local archive research"
readme = "src/archive_research/README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["archive_research*"]
