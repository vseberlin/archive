[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iss-archive-research"
version = "0.4.0"
description = "Local archive extraction, cross-references, evidence assessment and review"
readme = "src/archive_research/README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
archive-research = "archive_research.cli:main"

[project.optional-dependencies]
web = ["Django==5.2.19", "asgiref==3.13.0", "sqlparse==0.6.1"]
images = ["Pillow==11.1.0"]
spelling = ["symspellpy==6.9.0"]
vision = ["Pillow==11.1.0", "numpy==2.2.6", "opencv-python-headless==4.12.0.88"]
embeddings = ["Pillow==11.1.0", "numpy==2.2.6", "torch==2.15.0+cpu", "torchvision==0.29.2+cpu", "open_clip_torch==3.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["archive_research*"]

[tool.setuptools.package-data]
"archive_research" = ["kraken-LICENSE.txt"]
"archive_research.web" = ["fixture.json", "templates/research_web/*.html"]
