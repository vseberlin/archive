function updateTechnical(){const target=$('technical');if(!target)return;target.replaceChildren(...selectedAssets.map((a,i)=>a?node('div',{},node('h3',{},(i?'B · ':'A · ')+a.label),node('p',{},a.path),node('p',{},a.sha256?'Stored SHA-256: '+a.sha256:'No stored cryptographic hash is supplied for this comparison image.'),node('p',{},a.evidence||'Accessioned representation; the image is decoded in memory for viewing.')):node('div')))}
let imageTickets=[0,0];
async function loadAsset(index,assetIndex,size=1800){const ticket=++imageTickets[index],recordKey=current.object.record_key;const a=current.assets[assetIndex];selectedAssets[index]=a;pictures[index]=null;$('select-'+index).value=String(assetIndex);$('image-status-'+index).textContent='Loading '+a.label.toLowerCase()+'…';$('image-meta-'+index).textContent='';updateTechnical();drawAll();
 const im=new Image();im.onload=()=>{if(ticket!==imageTickets[index]||current?.object.record_key!==recordKey)return;pictures[index]=im;$('image-status-'+index).textContent='';$('image-meta-'+index).textContent=(a.dimensions?a.dimensions.join(' × ')+' source px · ':im.naturalWidth+' × '+im.naturalHeight+' displayed px · ')+(a.size_bytes?readableBytes(a.size_bytes)+' · ':'')+(a.evidence||'In-memory view')+(size===5000?' · full detail loaded':'');drawAll()};
 im.onerror=()=>{if(ticket!==imageTickets[index]||current?.object.record_key!==recordKey)return;$('image-status-'+index).textContent='Image unavailable. Check the source status or local website, then refresh.'};im.src=imageURL(a,size);}
function fullResolution(){for(let i=0;i<2;i++)loadAsset(i,Number($('select-'+i).value),5000)}
function changeZoom(factor){for(const i of (linked?[0,1]:[activePane])){zoom[i]=Math.min(10,Math.max(1,zoom[i]*factor));if(zoom[i]===1)pan[i]={x:0,y:0}}zoomLabel();drawAll()}
function bindCanvas(canvas){let drag=null;const target=()=>{const i=canvases.indexOf(canvas);if(i<2)activePane=i;zoomLabel()};canvas.addEventListener('wheel',e=>{e.preventDefault();target();changeZoom(e.deltaY<0?1.15:1/1.15)},{passive:false});canvas.addEventListener('pointerdown',e=>{target();drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;for(const i of (linked?[0,1]:[activePane])){pan[i].x+=(e.clientX-drag.x)/canvas.clientWidth;pan[i].y+=(e.clientY-drag.y)/canvas.clientHeight}drag={x:e.clientX,y:e.clientY};drawAll()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('dblclick',resetView)}
function draw(canvas,index){const rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height)return;const ratio=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(rect.height*ratio);const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;ctx.fillStyle='#dfe2da';ctx.fillRect(0,0,w,h);
 const paint=(im,layer,alpha=1,difference=false)=>{if(!im)return;const scale=Math.min(w/im.naturalWidth,h/im.naturalHeight)*zoom[layer];const iw=im.naturalWidth*scale,ih=im.naturalHeight*scale;ctx.globalAlpha=alpha;ctx.globalCompositeOperation=difference?'difference':'source-over';ctx.drawImage(im,(w-iw)/2+pan[layer].x*w,(h-ih)/2+pan[layer].y*h,iw,ih);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'};
 if(index<2)paint(pictures[index],index);else{paint(pictures[0],0);paint(pictures[1],1,mode==='overlay'?opacity:1,mode==='difference')}}
function drawAll(){canvases.forEach((c,i)=>draw(c,i))}
window.addEventListener('resize',drawAll);
async function save(action,candidate=''){const status=$('save-status');status.classList.remove('error');status.textContent='Saving…';const payload={record:current.object.record_key,version:current.version,action,candidate,note:$('note').value};document.querySelector('.decision').classList.add('busy');
 try{const data=await api('/api/decision',{method:'POST',headers:{'Content-Type':'application/json','X-NEF-Token':csrf},body:JSON.stringify(payload)});current=data;dirty=false;renderReview();sidebar();$('save-status').textContent=action==='unresolved'?'Open question saved. The earlier Master and relationships are preserved.':'Saved to the existing decision records and CSV mirrors. Archive files are unchanged.'}catch(e){status.classList.add('error');status.textContent=e.message;document.querySelector('.decision').classList.remove('busy')}}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
window.addEventListener('popstate',()=>{if(dirty&&!confirm('Leave this page and discard the unsaved note?')){history.pushState(null,'',renderedLocation);return}dirty=false;renderRoute()});
$('refresh-mount').addEventListener('click',async()=>{if(dirty&&!confirm('Refresh and discard the unsaved note?'))return;dirty=false;try{overview=await api('/api/overview');mountBar();renderRoute()}catch(e){showError(e)}});
(async()=>{try{overview=await api('/api/overview');mountBar();await renderRoute()}catch(e){showError(e)}})();
</script>
</body>
</html>
