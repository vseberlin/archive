<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avantmedia · image and metadata review</title>
<style>
:root{font:15px system-ui;color:#263b31;background:#f3f2ed}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}header{padding:16px 22px;background:white;border-bottom:1px solid #bcc8bf}h1{font-size:24px;margin:0 0 8px}h2{font-size:21px}h3{font-size:17px}p{line-height:1.5}input,select,button,textarea{font:inherit;padding:8px;border:1px solid #a8b6ad;border-radius:5px;background:white}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button.primary{background:#244f40;color:white}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.wrap{padding:20px;max-width:2000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}.card,.panel{background:white;border:1px solid #d0d8d1;border-radius:8px;padding:14px}.card{cursor:pointer;text-align:left;color:inherit}.card img{height:220px;width:100%;object-fit:contain;background:#e8e9e3}.muted{font-size:13px;color:#58695d}.path{font-size:12px;overflow-wrap:anywhere}.triple{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(290px,.9fr);gap:18px}.triple section{min-width:0}.triple select,.triple input{width:100%;margin-bottom:8px}.photo{width:100%;height:44vh;object-fit:contain;background:#e8e9e3}.reference{width:150px;max-height:150px;object-fit:contain}.detail{margin-bottom:20px}.badge{padding:4px 7px;background:#e6ebdf;border-radius:4px;display:inline-block;font-size:12px;margin:3px 4px 3px 0}.warn{background:#fff1d7;border-left:3px solid #b67a23;padding:10px}.nav{display:flex;gap:8px;justify-content:space-between;align-items:center}.error{color:#912c20}.success{color:#216747}.decision{padding:16px;background:#edf2ec;margin-top:18px}.decision select{max-width:100%}textarea{display:block;width:100%;max-width:1100px;height:72px;margin:10px 0}dl{margin:8px 0}dt{font-weight:650;font-size:13px;margin-top:10px}dd{margin:3px 0;line-height:1.45;white-space:pre-line}details{margin:10px 0}a{color:#1b5c84}.saved{background:#d7ebdf}.links a{display:block;margin:7px 0}#more{display:block;margin:20px auto}.card:focus{outline:3px solid #799c8a}#message{min-height:22px}@media(max-width:1100px){.triple{grid-template-columns:1fr 1fr}.metadata{grid-column:1/-1}}@media(max-width:700px){.triple{grid-template-columns:1fr}.metadata{grid-column:auto}.photo{height:45vh}.wrap{padding:10px}.nav{align-items:start;flex-wrap:wrap}}
</style>
<header><h1>Avantmedia · image and metadata review</h1><p id="summary">Loading…</p><div class="controls">
<input id="q" aria-label="Find TIFF" placeholder="Filename, inventory or subject">
<select id="filter" aria-label="Comparison findings"><option value="review">Needs examination</option><option value="new">New additions — 3 confirmed</option><option value="conflict">Metadata / image links differ</option><option value="gap">Image coverage needs review</option><option value="all">All TIFFs</option><option value="matched">Existing image matches</option><option value="prior">Earlier curator decisions</option><option value="other">Other collection</option><option value="unreadable">Unreadable TIFFs</option><option value="saved">Saved review decisions</option></select>
<label><input id="invert" type="checkbox" checked> Invert negative scans</label><span id="count"></span><a href="/tiff-review-decisions" target="_blank">Saved decisions</a><a href="/">Earlier 305-photo review</a>
</div><p class="muted">Review proposals only. Source TIFFs and accessioned files stay unchanged. A different image displaced by a correction remains unresolved for reassignment.</p></header>
<main class="wrap"><section id="detail"></section><section id="grid" class="grid"></section><button id="more" hidden>Show more TIFFs</button></main>
<script>
let rows=[],masters={},metadata={},proposals={},decisions={},revision='',token='',current='',limit=12,dirty=false,saving=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={possible_new_kurt_object:'New addition confirmed by user · metadata for review',known_object_image_gap:'Image coverage needs review',other_collection:'Other collection',prior_curator_hold:'Earlier curator hold',prior_curator_redundant:'Earlier redundant decision',prior_alias_image_conflict:'Earlier alias decision needs review',existing_kurt_image_match:'Image matched to an existing Master',unreadable_tiff:'Unreadable TIFF'};
const actions={confirm_existing:'Confirm displayed Master; Avantmedia TIFF is the same photo and redundant',assign_source:'Assign selected metadata to Avantmedia TIFF as proposed Master',assign_master:'Assign selected metadata to the displayed archive image',new_object:'Select Avantmedia TIFF as Master of a new object',redundant:'Reject this candidate / mark redundant',unresolved:'Skip / leave unresolved'};
const isReview=r=>['possible_new_kurt_object','known_object_image_gap','prior_alias_image_conflict','unreadable_tiff'].includes(r.finding)||r.metadata_link_differs_from_image_match;
function filtered(){const q=$('#q').value.toLowerCase(),f=$('#filter').value;return rows.filter(r=>[r.filename,r.source_relative_path,caption(r),r.review_note,...(r.catalogue_record_keys||[]),...(r.name_record_keys||[]),...(r.historical_inventory_leads||[]),...candidates(r).map(k=>metadata[k]?.inventory+' '+metadata[k]?.title)].join(' ').toLowerCase().includes(q)&&(f==='all'||f==='review'&&isReview(r)||f==='new'&&!!proposals[r.source_path]||f==='conflict'&&r.metadata_link_differs_from_image_match||f==='gap'&&r.finding==='known_object_image_gap'||f==='matched'&&r.finding==='existing_kurt_image_match'||f==='prior'&&(r.prior_census_decisions?.length||r.prior_alias_decisions?.length)||f==='other'&&r.finding==='other_collection'||f==='unreadable'&&!r.feature.hashes||f==='saved'&&!!decisions[r.source_path]));}
function invert(r){return $('#invert').checked&&!r.source_relative_path.includes('Glasplatten')&&!r.source_relative_path.includes('Auftrag 1614930')}
function imageURL(r,thumb=false){return '/tiff-scan-image?source='+encodeURIComponent(r.source_path)+'&invert='+(invert(r)?1:0)+'&thumb='+(thumb?1:0)}
function caption(r){return proposals[r.source_path]?.title||r.accepted_metadata?.proposed_title||metadata[r.catalogue_record_keys?.[0]]?.title||metadata[r.name_record_keys?.[0]]?.title||r.review_title||r.filename}
function candidates(r){return [...new Set([...(r.catalogue_record_keys||[]),...(r.name_record_keys||[]),...(r.prior_alias_decisions||[]).map(x=>x.alias_record_key),...(r.review_comparison_keys||[]),...(r.residual_pixel_matches||[]).map(x=>x.record_key),...(r.strong_matches||[]).map(x=>x.record_key),...(r.orientation_matches||[]).map(x=>x.record_key),...(r.nearest_matches||[]).map(x=>x.record_key)])].filter(k=>metadata[k]);}
function failedImages(){document.querySelectorAll('img').forEach(img=>img.onerror=()=>{const p=document.createElement('p');p.className='error';p.textContent=img.classList.contains('reference')?'Public reference unavailable; use the catalogue link.':'Image cannot be rendered. Check its recorded decoding failure.';img.replaceWith(p);});}
function draw(){const visible=filtered();$('#count').textContent=visible.length+' shown · '+Object.keys(decisions).length+' saved';$('#grid').innerHTML=visible.slice(0,limit).map(r=>`<button type="button" class="card" data-path="${esc(r.source_path)}"><img loading="lazy" src="${imageURL(r,true)}" alt="TIFF ${esc(r.filename)}"><h3>${esc(r.filename)}</h3><p>${esc(caption(r))}</p><span class="badge">${esc(labels[r.finding]||r.finding)}</span>${r.metadata_link_differs_from_image_match?'<span class="badge warn">Metadata link differs from image match</span>':''}${decisions[r.source_path]?`<span class="badge saved">${esc(actions[decisions[r.source_path].action])}</span>`:''}</button>`).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{if(canLeave())show(rows.find(r=>r.source_path===c.dataset.path));});$('#more').hidden=visible.length<=limit;failedImages();}
function canLeave(){if(saving)return false;return !dirty||window.confirm('Discard the unsaved review choice?');}
function metadataHTML(m){if(!m)return '<p>No metadata assigned.</p>';return `<dl><dt>Title</dt><dd>${esc(m.title)}</dd><dt>Date</dt><dd>${esc(m.date_text||'Unresolved')}</dd><dt>Description</dt><dd>${esc(m.description||'Unresolved')}</dd><dt>Photographer</dt><dd>${esc(m.creator||'Unresolved')}</dd><dt>Place</dt><dd>${esc(m.places||'Unresolved')}</dd><dt>Keywords</dt><dd>${esc(m.tags||'Unresolved')}</dd></dl>${m.uncertainty?`<p class="warn">${esc(m.uncertainty)}</p>`:''}<p class="muted">${esc(m.basis||'')}</p>${m.historical_inventory_lead?`<p>Historical inventory lead: ${esc(m.historical_inventory_lead)}</p>`:''}<div class="links">${(m.evidence||[]).map(e=>`<a href="${esc(e.url)}" target="_blank" rel="noreferrer">${esc(e.label)}</a><span class="muted">${esc(e.supports)}</span>`).join('')}${m.catalogue_url?`<a href="${esc(m.catalogue_url)}" target="_blank" rel="noreferrer">Public catalogue · ${esc(m.inventory||m.record_key)}</a>`:''}</div>`;}
function recordOption(k){return `<option value="${esc(k)}">${esc(metadata[k]?.inventory||masters[k]?.inventory||k)} · ${esc(metadata[k]?.title||masters[k]?.title||k)}</option>`;}
function fillChoices(r,selector,search,forMaster=false,preferred=''){const previous=preferred||$(selector).value,q=$(search).value.toLowerCase();const dict=forMaster?masters:metadata;const first=candidates(r).filter(k=>dict[k]);const keys=[...first,...Object.keys(dict).filter(k=>!first.includes(k))].filter(k=>!q||[k,metadata[k]?.inventory,metadata[k]?.title].join(' ').toLowerCase().includes(q));if(previous&&dict[previous]&&!keys.includes(previous))keys.unshift(previous);let special=forMaster?'<option value="">No archive comparison</option>':'<option value="">Metadata unresolved</option>';if(!forMaster&&proposals[r.source_path])special+=`<option value="${esc(r.source_path)}">Researched caption for this new TIFF</option>`;$(selector).innerHTML=special+keys.map(recordOption).join('');$(selector).value=previous||'';}
function show(r){current=r.source_path;dirty=false;const d=decisions[current],keys=candidates(r),mk=d?.metadata_key??(proposals[current]?current:(keys[0]||'')),ak=d?.master_key??(masters[mk]?mk:keys.find(k=>masters[k])||'');
$('#detail').innerHTML=`<article class="panel detail"><div class="nav"><h2>${esc(r.filename)}</h2><div><button id="previous">Previous</button> <button id="next">Next</button> <button id="close">Close</button></div></div><p><span class="badge">${esc(labels[r.finding]||r.finding)}</span>${r.metadata_link_differs_from_image_match?'<span class="badge warn">Catalogue link and image match differ</span>':''}</p><details><summary>Comparison evidence and earlier decisions</summary><p>${esc(r.review_note||'Similarity is a review lead, not an object decision.')}</p><p>Catalogue/name leads: ${esc([...(r.catalogue_record_keys||[]),...(r.name_record_keys||[])].join(', ')||'None')}</p>${(r.prior_alias_decisions||[]).map(p=>`<p class="warn">Earlier alias: ${esc(p.alias_record_key)} / ${esc(p.alias_inventory)} → ${esc(p.canonical_inventory)}. ${esc(p.decision_basis)}.</p>`).join('')}${(r.prior_census_decisions||[]).map(p=>`<p class="warn">Earlier decision: ${esc(p.decision.disposition)} · ${esc(p.decision.reason)}</p>`).join('')}</details>
<div class="triple"><section><h3>1 · Avantmedia TIFF</h3><img class="photo" src="${imageURL(r)}" alt="TIFF detail ${esc(r.filename)}"><p class="path">${esc(r.source_path)}</p><p class="muted">Direct TIFF display${invert(r)?'; negative inverted for viewing':''}. No source JPEG is used.</p><details><summary>Earlier source metadata proposal</summary>${metadataHTML(r.accepted_metadata?.proposed_title?{title:r.accepted_metadata.proposed_title,date_text:r.accepted_metadata.proposed_date,description:r.accepted_metadata.proposed_description,creator:r.accepted_metadata.proposed_creator,places:r.accepted_metadata.proposed_place,tags:r.accepted_metadata.proposed_tags,basis:r.accepted_metadata.proposal_basis}:null)}</details></section>
<section><h3>2 · Existing archive image</h3><input id="masterSearch" aria-label="Find archive Master" placeholder="Search all Masters by subject or inventory"><select id="match" aria-label="Master comparison"></select><div id="master"></div></section>
<section class="metadata"><h3>3 · Metadata to assign</h3><input id="metaSearch" aria-label="Find metadata record" placeholder="Search all catalogue records"><select id="metadataChoice" aria-label="Metadata to assign"></select><div id="metadata"></div></section></div>
<div class="decision"><h3>Review decision</h3><label for="action">Action</label> <select id="action"><option value="">Choose a review action…</option>${Object.entries(actions).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}</select><p id="effect"></p><label for="note">Short note (optional)</label><textarea id="note" maxlength="1000" placeholder="Reason, correction or research lead">${esc(d?.note||'')}</textarea><button class="primary" id="save">Save review decision</button> <span id="message" role="status">${d?'Saved '+esc(d.reviewed_at):'No decision saved for this TIFF.'}</span><div id="savedDetail"></div></div></article>`;
fillChoices(r,'#match','#masterSearch',true,ak);fillChoices(r,'#metadataChoice','#metaSearch',false,mk);$('#action').value=d?.action||'';
$('#masterSearch').oninput=()=>fillChoices(r,'#match','#masterSearch',true);$('#metaSearch').oninput=()=>fillChoices(r,'#metadataChoice','#metaSearch');$('#match').onchange=()=>{dirty=true;drawMaster(r);effect(r)};$('#metadataChoice').onchange=()=>{dirty=true;drawMetadata(r);effect(r)};$('#action').onchange=()=>{dirty=true;effect(r)};$('#note').oninput=()=>dirty=true;$('#save').onclick=()=>save(r);
const visible=filtered(),i=visible.findIndex(x=>x.source_path===current);$('#previous').disabled=i<=0;$('#next').disabled=i<0||i===visible.length-1;$('#previous').onclick=()=>{if(canLeave())show(visible[i-1])};$('#next').onclick=()=>{if(canLeave())show(visible[i+1])};$('#close').onclick=()=>{if(canLeave()){$('#detail').innerHTML='';current='';dirty=false}};
drawMaster(r);drawMetadata(r);effect(r);savedDetail(d);$('#detail').scrollIntoView({block:'start'});failedImages();}
function drawMaster(r){const key=$('#match').value,m=masters[key];if(!m){$('#master').textContent='Choose a Master to compare.';return}const hit=[...(r.residual_pixel_matches||[]),...(r.strong_matches||[]),...(r.orientation_matches||[]),...(r.nearest_matches||[])].find(x=>x.record_key===key);$('#master').innerHTML=`<img class="photo" src="/tiff-scan-master?record=${encodeURIComponent(key)}" alt="Master ${esc(m.inventory||key)}"><p class="path">${esc(m.master_path)}</p>${hit?`<p class="muted">pHash distance ${esc(hit.phash_distance)}/64 · image similarity is a lead</p>`:''}<details open><summary>Metadata currently assigned to this file</summary>${metadataHTML(metadata[key])}</details>`;failedImages();}
function drawMetadata(r){const key=$('#metadataChoice').value,m=key===r.source_path?proposals[key]:metadata[key];$('#metadata').innerHTML=metadataHTML(m)+(m?.public_image_url?`<details open><summary>Public catalogue reference image</summary><img class="reference" src="${esc(m.public_image_url)}" alt="Public catalogue reference ${esc(m.inventory)}"><p class="muted">Reference for this catalogue identity; it is not a local Master. Compare visually.</p></details>`:'')+(m?.public_text_differs?`<details><summary>Public text differs from the accession catalogue</summary><p>${esc(m.public_record.title)}</p><p>${esc(m.public_record.description)}</p></details>`:'')+(m?.prior_alias_decision?`<p class="warn">This identity has an earlier alias decision. A reassignment remains a proposal.</p>`:'');failedImages();}
function effect(r){const a=$('#action').value,k=$('#metadataChoice').value,m=$('#match').value;let text='Choose an action after checking the images and caption.';if(a==='confirm_existing')text='Confirm that both images show the same photograph. Keep this object’s current Master and mark the Avantmedia TIFF redundant.';if(a==='assign_source')text='Propose this TIFF as the selected Master for the chosen catalogue identity. The displaced archive image remains unresolved for reassignment.';if(a==='assign_master')text='Propose the displayed archive image for the chosen metadata identity. Affected existing identities and displaced images remain visible in the saved record.';if(a==='new_object')text=proposals[r.source_path]?'Select “Researched caption for this new TIFF” to save that caption with the new object, or leave metadata unresolved.':'A new object will use this TIFF as its proposed Master. Leave metadata unresolved.';if(a==='redundant')text='Mark this candidate redundant. No file is deleted.';if(a==='unresolved')text='Leave this candidate unresolved.';$('#effect').textContent=text;}
function savedDetail(d){$('#savedDetail').innerHTML=d?`<p class="path">Proposed Master: ${esc(d.selected_master_path||'None')}</p>${d.unresolved_candidates?.length?`<p class="path warn">Still unresolved: ${esc(d.unresolved_candidates.join('\n'))}</p>`:''}${d.affected_existing_objects?.map(x=>`<p class="warn">${esc(x.record_key)}: ${esc(x.note)}</p>`).join('')||''}`:'';}
async function save(r){const payload={source_path:r.source_path,action:$('#action').value,metadata_key:$('#metadataChoice').value,master_key:$('#match').value,note:$('#note').value,previous_revision:revision};if(!payload.action){$('#message').textContent='Choose an action first.';return}if(payload.action==='new_object'&&payload.metadata_key!==r.source_path&&payload.metadata_key!==''){$('#message').textContent='Choose this TIFF’s researched caption, or “Metadata unresolved”, for a new object.';return}saving=true;$('#save').disabled=true;$('#message').textContent='Saving…';try{const res=await fetch('/api/tiff-review',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(payload)});const j=await res.json();if(!res.ok)throw new Error(j.error);decisions[r.source_path]=j.decision;revision=j.revision;dirty=false;$('#message').className='success';$('#message').textContent='Saved. Archive files unchanged.';savedDetail(j.decision);draw();}catch(e){$('#message').className='error';$('#message').textContent=e.message;}finally{saving=false;$('#save').disabled=false}}
let lastFilter='review';$('#filter').onchange=()=>{if(!canLeave()){$('#filter').value=lastFilter;return}lastFilter=$('#filter').value;$('#detail').innerHTML='';current='';dirty=false;limit=12;draw()};$('#q').oninput=()=>{limit=12;draw()};$('#invert').onchange=()=>{draw();if(current){const r=rows.find(x=>x.source_path===current),img=document.querySelector('[alt="TIFF detail '+CSS.escape(r.filename)+'"]');if(img)img.src=imageURL(r)}};$('#more').onclick=()=>{limit+=12;draw()};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
fetch('/api/tiff-scan').then(r=>{if(!r.ok)throw new Error('Workbench data unavailable');return r.json()}).then(j=>{rows=j.candidates;masters=j.masters;metadata=j.metadata_records;proposals=j.new_metadata;decisions=j.decisions;revision=j.revision;token=j.token;$('#summary').textContent=`${rows.length} source TIFFs · ${Object.keys(masters).length} current Masters · ${Object.keys(proposals).length} researched new additions · ${rows.filter(r=>r.metadata_link_differs_from_image_match).length} differing metadata/image links`;draw()}).catch(e=>$('#summary').textContent=e.message);
</script></html>
