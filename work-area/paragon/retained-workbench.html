<style>

<header><h1>Paragon · image review</h1><p>Only undecided pictures are shown. Saved choices leave this review queue.</p><nav><a href="/retained/?view=pending">Pending evidence</a><a href="/retained/">Undecided pictures</a><a href="/retained/audit" target="_blank" rel="noopener">Full audit</a></nav></header>
<div class="layout"><aside><div class="filters"><input id="search" type="search" placeholder="Find an inventory number or filename" aria-label="Find picture"><select id="match" aria-label="Comparison filter"><option value="all">All comparisons</option><option value="matched">Similar to accessioned</option><option value="new">No match · higher resolution</option></select><select id="question" aria-label="Evidence question" hidden><option value="all">All evidence questions</option></select><div id="counts" class="counts">Loading pictures…</div></div><div id="pictureList"></div></aside><main id="main"><div id="auditSummary"></div><div id="mainInner"><p>Loading image comparisons…</p></div></main></div>
<dialog id="viewer"><div class="dialogtop"><span id="viewerLabel"></span><div><button id="zoomNative">Actual preview pixels</button> <button id="closeViewer">Close</button></div></div><div class="zoomarea"><img id="large" alt="Enlarged image"></div></dialog>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let indexData, current, currentPicture, currentPath='', filtered=[], dirty=false, loading=false, saving=false, loadSerial=0;
const pendingView=/[?&]view=pending(?:&|$)/.test(location.search||'');
let auditData=null;
const stateNames={unresolved:'Unresolved',retain:'Consider for accession',redundant:'Redundant',noise_drain:'Recorded drain proposal',selected_master:'Master selected',carrier_section:'Retained carrier section',member:'Retained member'};
function registeredLabel(p){return p.state==='selected_master'?'Accessioned Master source':p.state==='carrier_section'?'Accessioned carrier section':'Registered redundant / drain';}
function imageUrl(path,full=false){return '/retained/image?path='+encodeURIComponent(path)+(full?'&full=1':'');}
async function api(url,options){const response=await fetch(url,options),data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data;}
function matchingPictures(){const q=$('#search').value.trim().toLowerCase(),match=$('#match').value;return indexData.pictures.filter(p=>(pendingView?!!p.pending_accession:p.remaining)&&
 (!pendingView||!$('#question').value||$('#question').value==='all'||questionFor(p.path)?.question===$('#question').value)&&
 (match==='all'||match==='matched'&&p.comparison?.reference||match==='new'&&p.high_resolution&&p.comparison?.finding==='no_close_hash_match')&&
 (!q||[p.name,p.path,p.case_label,p.pending_accession?.existing_catalogue_association,p.comparison?.reference?.inventory,p.comparison?.reference?.title].join(' ').toLowerCase().includes(q)));}
function renderList(){filtered=matchingPictures();const remaining=indexData.pictures.filter(p=>p.remaining).length;$('#counts').textContent=pendingView?`${filtered.length} shown · ${indexData.pictures.filter(p=>p.pending_accession).length} pending · ${remaining} undecided`:`${filtered.length} shown · ${remaining} undecided`;$('#pictureList').innerHTML=filtered.map(p=>`<button data-path="${esc(p.path)}" class="${p.path===currentPath?'active':''}" ${saving||loading?'disabled':''}><strong>${esc(p.name)}</strong><span>${p.width} × ${p.height}${p.comparison?.reference?' · ↔ '+esc(p.comparison.reference.inventory):''}</span><span>${pendingView?esc(questionFor(p.path)?.question||'Pending evidence'):'Needs a decision'}</span></button>`).join('')||`<p class="empty">${pendingView?'No pending sources':'No undecided pictures'} in this view.</p>`;document.querySelectorAll('[data-path]').forEach(el=>el.onclick=()=>openPicture(el.dataset.path));}
function finding(p,hint){if(hint?.finding==='accessioned_source')return {title:registeredLabel(p),detail:'This exact source has been accessioned for '+hint.reference.inventory+'. The left image is generated from its selected Master. Its saved decision does not need repeating.'};if(hint?.finding==='documented_member')return {title:p.state==='redundant'?'Same invitation interior already archived · saved as Redundant':'Same invitation interior already archived · choose Redundant',detail:`The existing TIFF Master and this JPEG are both ${hint.master_dimensions.join(' × ')}. This source copy adds no content or resolution. ${p.state==='redundant'?'The saved Redundant choice keeps the existing Master.':'Choose Redundant to keep the existing Master.'}`};if(hint?.reference){const ref=hint.reference;let detail='Compare the full image before deciding whether the retained file is redundant.';if(hint.manufactured_surrogate||hint.source_has_more_pixels)detail='This retained image may be a better Master for the existing object. Compare quality and consider it for accession.';if(hint.filename_mismatch)detail+=` The filename says ${hint.filename_label}; the visual match is ${ref.inventory}.`;return {title:`${hint.finding==='close'?'Close':'Possible'} match to accessioned ${ref.inventory}`,detail};}
 if(hint?.finding==='no_close_hash_match')return {title:'No whole-image match found',detail:hint.catalogue_changed?'The earlier whole-image search found no close match. This does not mean the content is absent from the archive: crops, carrier sections and newer accessions still need comparison.':p.high_resolution?'No close full-image match was found. Check existing crops and carrier sections before treating this as new content.':'No close full-image match was found. Leave unresolved if a larger source is needed.'};
 if(p.pending_accession)return {title:'Archive comparison still needed',detail:'This file remains outside the completed accession. Confirm the same physical specimen before replacing an existing Master.'};
 return {title:p.read_only?'Previously recorded picture':'Comparison needs checking',detail:p.read_only?'This saved decision is preserved. It is outside the remaining-picture review.':'The current similarity evidence does not cover this image. This does not establish that it is new.'};}
function imageHTML(item){return item?.decoded?`<img src="${imageUrl(item.path)}" alt="${esc(item.inventory||item.name)}" data-zoom="${esc(item.path)}">`:`<div class="placeholder">${item?'No readable image preview.':'No whole-image comparison available.<br>This does not establish that the content is new.'}</div>`;}
function controls(){const blocked=saving||loading;for(const id of ['search','match'])$('#'+id).disabled=blocked;document.querySelectorAll('[data-path]').forEach(el=>el.disabled=blocked);const editable=currentPicture?.remaining&&!currentPicture.read_only&&currentPicture.decoded;for(const el of document.querySelectorAll('input[name=choice]'))el.disabled=blocked||!editable||el.value==='redundant'&&!current?.source_comparisons?.[currentPath]?.reference;for(const id of ['save','saveNext'])if($('#'+id))$('#'+id).disabled=blocked||!editable||!hasChanges();if($('#note'))$('#note').disabled=blocked||!editable;if($('#discard'))$('#discard').disabled=blocked||!dirty;const at=filtered.findIndex(p=>p.path===currentPath);if($('#previous'))$('#previous').disabled=blocked||at<=0;if($('#next'))$('#next').disabled=blocked||at<0;}
function hasChanges(){const file=current?.decision?.files?.find(f=>f.path===currentPath),choice=$('input[name=choice]:checked')?.value;return !!choice&&(!file||choice!==file.state||!!$('#note')?.value.trim());}
function changed(){dirty=hasChanges();$('#message').textContent=dirty?'Unsaved choice':'Saved choice unchanged · use Next to continue.';$('#message').className='';controls();}
function masterCaption(ref,hint){const dimensions=hint?.master_dimensions||ref?.master_dimensions,format=hint?.master_format||ref?.master_format;return dimensions?' · Master: '+(format?esc(format)+' · ':'')+esc(dimensions.join(' × ')):'';}
function renderPicture(){const p=currentPicture;if(!p.remaining){savedView(p);return;}const hint=current.source_comparisons?.[p.path],carrierViews=hint?.reference?[]:(current.carrier_context||[]),pending=current.pending_sources?.[p.path]||p.pending_accession,ref=hint?.reference||carrierViews[0]||pending?.catalogue_context,d=current.decision||{},file=(d.files||[]).find(f=>f.path===p.path),contextOnly=!hint?.reference&&!!ref,summary=carrierViews.length?{title:'Archived carrier and photographs available · '+current.label,detail:'Compare this source with the whole carrier and its accessioned photographs using the selector below. A whole-image search can miss sections and crops. Extra board area or neighbouring photographs are not covered by a single cropped photograph Master.'}:contextOnly?{title:'Catalogue association · identity unconfirmed',detail:'The left image is already in the archive. Its association with this source copy is unconfirmed; compare the physical specimen before deciding.'}:finding(p,hint);const editable=!p.read_only&&p.decoded;const priorNote=(file?.note||pending?.review_note||'').split("Reviewed by Codex under Vladimir's 21 September rules. " ).pop();
 $('#mainInner').innerHTML=`<div class="topline"><div><span class="eyebrow">UNDECIDED PICTURE</span><h2>${esc(p.name)}</h2></div><div class="nav"><button id="previous">Previous</button><button id="next">Next</button></div></div><div class="finding"><strong>${esc(summary.title)}</strong><p>${esc(summary.detail)}</p></div>${carrierViews.length?`<label class="note" for="archiveView">Compare with an existing archive view</label><select id="archiveView" style="margin-bottom:16px">${carrierViews.map(view=>`<option value="${esc(view.path)}">${esc(view.view_label)}</option>`).join('')}</select>`:''}<div class="pair"><section class="column"><h3 id="archiveHeading">Already archived${ref?' · '+esc(ref.inventory):''}</h3><div class="imagebox" id="archiveImage">${imageHTML(ref)}</div><div class="caption" id="archiveCaption">${ref?esc(ref.title||ref.inventory)+masterCaption(ref,hint):''}</div></section><section class="column"><h3>Source copy · ${file?'saved choice':'being reviewed'}</h3><div class="imagebox">${imageHTML(p)}</div><div class="caption">${esc(p.name)} · ${p.width} × ${p.height} · ${esc(p.format)}</div></section></div>
 ${pending?`<div class="finding" style="margin-top:18px"><strong>${file?'Saved: '+esc(stateNames[file.state]||file.state):'Why this file is pending'}</strong><p>${p.state==='unresolved'?'This picture is unresolved. Choose only when the available evidence supports a decision.':p.state==='redundant'?'Marked redundant. Awaiting inclusion in the final drain list; no file has been deleted.':hint?.finding==='documented_member'?'The earlier saved choice was to retain this JPEG. The documented match now supports marking it redundant.':p.state==='selected_master'?'This TIFF was selected over its local JPEG. Its archive object and quality still need confirmation; the saved Master choice is preserved.':carrierViews.length?'Consider for accession is already saved for this carrier section and its additional content. Its object or Master binding still needs resolving before accession; this choice does not need saving again.':'Consider for accession is already saved. Object identity and the final Master still need resolving before accession; this choice does not need saving again.'}</p>${!['selected_master','redundant'].includes(p.state)&&hint?.finding!=='documented_member'&&priorNote?`<p>${esc(priorNote)}</p>`:''}<p class="subtle">Confirm the same physical specimen. Keep uncertain bindings pending.</p></div>`:''}
 <section class="decision"><h3>${editable?(file?'Saved choice · change only if needed':'What should happen to this source copy?'):'Saved decision'}</h3>${editable?`<div class="choices"><label><input type="radio" name="choice" value="redundant">Redundant<span>Keep the existing Master; this source copy adds no needed detail.</span></label><label><input type="radio" name="choice" value="retain">Consider for accession<span>${carrierViews.length?'Preserve additional carrier content if it is not already covered.':ref?'This source has better quality or additional content.':'Check whether this adds content or quality beyond the archive.'}</span></label><label><input type="radio" name="choice" value="unresolved">Leave unresolved<span>More evidence or a closer look is needed.</span></label></div><label class="note" for="note">Short note · optional</label><textarea id="note" maxlength="1000" rows="2" placeholder="What needs attention?"></textarea><div class="savebar"><div id="message" aria-live="polite">${file?'Saved: '+esc(stateNames[file.state]||file.state)+' · use Next to continue.':'Choose after comparing the images.'}</div><div class="buttons"><button id="discard">Discard edits</button><button id="save">Save</button><button id="saveNext" class="primary">Save and next</button></div></div>`:`<p>${p.registered?registeredLabel(p)+'.':esc(stateNames[file?.state]||p.state)}${!p.decoded?' This file has no readable preview.':''}</p><p class="subtle">${pending?'The saved selection is preserved while its archive binding remains pending.':'This record is outside the remaining-picture review.'}</p>`}<p class="subtle">These choices record consideration or redundancy. Accession and deletion require separate instructions.</p></section>
 <details><summary>File paths and saved evidence</summary><p><strong>Source copy:</strong> ${esc(p.path)}</p>${ref?`<p><strong>Accessioned preview:</strong> <span id="comparisonPath">${esc(ref.path)}</span></p>`:''}${file?.note?`<p><strong>Saved picture note:</strong> ${esc(file.note)}</p>`:''}${d.note?`<p><strong>Earlier group note:</strong> ${esc(d.note)}</p>`:''}</details>`;
 if($('#archiveView'))$('#archiveView').onchange=showCarrierView;document.querySelectorAll('[data-zoom]').forEach(el=>el.onclick=()=>zoom(el.dataset.zoom));document.querySelectorAll('input[name=choice]').forEach(el=>{el.checked=el.value===(['retain','redundant','unresolved'].includes(file?.state)?file.state:'unresolved');el.onchange=changed;});if(editable){$('#note').value='';$('#note').oninput=changed;$('#save').onclick=()=>save(false);$('#saveNext').onclick=()=>save(true);$('#discard').onclick=()=>openPicture(currentPath,true);}$('#previous').onclick=()=>step(-1);$('#next').onclick=()=>step(1);controls();}
function showCarrierView(){const ref=(current.carrier_context||[]).find(view=>view.path===$('#archiveView').value);if(!ref)return;$('#archiveHeading').textContent='Already archived · '+ref.inventory;$('#archiveImage').innerHTML=imageHTML(ref);$('#archiveCaption').textContent=(ref.title||ref.inventory)+(ref.master_dimensions?' · Master: '+ref.master_format+' · '+ref.master_dimensions.join(' × '):'');if($('#comparisonPath'))$('#comparisonPath').textContent=ref.path;document.querySelectorAll('#archiveImage [data-zoom]').forEach(el=>el.onclick=()=>zoom(el.dataset.zoom));}
function canLeave(){return !dirty||confirm('Discard the unsaved choice and move on?');}
async function openPicture(path,force=false){if(saving||loading||!force&&!canLeave())return;const p=indexData.pictures.find(p=>p.path===path);if(!p)return;if(pendingView)return openPendingPicture(p);if(!p.remaining){savedView(p);return;}loading=true;controls();const serial=++loadSerial;try{const data=await api('/retained/api/case?key='+encodeURIComponent(p.case_key));if(serial!==loadSerial)return;const file=(data.decision?.files||[]).find(f=>f.path===path),state=file?.state||'unresolved',locked=p.registered||!!(data.accession||data.section_accession||data.decision?.selected_master_path||data.decision?.source_version_pair);if(state!=='unresolved'||locked){Object.assign(p,{state,remaining:false,read_only:true});savedView(p);return;}current=data;currentPicture={...p,state,read_only:false};currentPath=path;dirty=false;history.replaceState(null,'','#'+encodeURIComponent(path));renderList();renderPicture();$('#main').scrollTop=0;}catch(e){if($('#message')){$('#message').textContent=e.message;$('#message').className='error';}else $('#mainInner').innerHTML='<p class="error">'+esc(e.message)+'</p>';}finally{loading=false;controls();}}
function endView(message='No more undecided pictures in this view.',detail=''){if(pendingView){endPendingView();return;}current=null;currentPicture=null;currentPath='';dirty=false;history.replaceState(null,'',location.pathname+location.search);renderList();const remaining=indexData.pictures.filter(p=>p.remaining).length;$('#mainInner').innerHTML=`<div class="empty"><h2>${esc(message)}</h2>${detail?`<p>${esc(detail)}</p>`:''}<p>${remaining?`${remaining} undecided picture${remaining===1?' remains':'s remain'}.`:'All picture decisions are recorded.'}</p><p>Saved choices remain recorded and are hidden from this workbench.</p>${filtered.length?'<button id="continueReview" class="primary">Review next undecided picture</button>':''}</div>`;if(filtered.length)$('#continueReview').onclick=()=>openPicture(filtered[0].path,true);}
function savedView(p){endView('Decision already saved',`${p.name}: ${p.registered?registeredLabel(p):stateNames[p.state]||p.state}. No further picture decision is needed.`);}

async function step(delta){if(saving||loading)return;const at=filtered.findIndex(p=>p.path===currentPath),next=filtered[at+delta];if(next)return openPicture(next.path);if(delta>0&&canLeave())endView();}
function forwardPath(order,path){const at=order.indexOf(path),visible=new Set(filtered.map(p=>p.path));return order.slice(at+1).find(p=>visible.has(p));}
async function save(goNext){if(saving||loading||!currentPicture?.remaining||currentPicture.read_only||!hasChanges())return;const chosen=$('input[name=choice]:checked');if(!chosen)return;const path=currentPath,order=filtered.map(p=>p.path),payload={case_key:current.key,previous_review:current.decision?.reviewed_at||'',source_path:path,file_state:chosen.value,comparison_path:current.source_comparisons?.[path]?.reference?.path||'',note:$('#note').value};saving=true;controls();try{await api('/retained/api/decision',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':indexData.token},body:JSON.stringify(payload)});dirty=false;indexData=await api('/retained/api/cases');renderList();const next=forwardPath(order,path),updated=indexData.pictures.find(p=>p.path===path);saving=false;if(goNext&&!next||!goNext&&!updated?.remaining){endView('Choice saved.');return;}await openPicture(goNext?next:path,true);if($('#message')){$('#message').textContent='Choice saved for this retained file.';$('#message').className='success';}}catch(e){if($('#message')){$('#message').textContent=e.message;$('#message').className='error';}}finally{saving=false;controls();}}


function questionFor(path){return auditData?.pending_question_groups.find(group=>group.paths.includes(path));}
async function setupPendingView(){
 auditData=await api('/retained/api/audit');
 document.title='Paragon · pending evidence';$('header h1').textContent='Paragon · pending evidence';
 $('header p').textContent=indexData.pending_count?'Saved choices are shown with their remaining identity or ownership questions.':'All remaining source decisions are recorded. No pending source review remains.';
 const groups=auditData.pending_question_groups.filter(g=>indexData.pictures.some(p=>p.pending_accession&&g.paths.includes(p.path)));
 $('#question').hidden=false;$('#question').innerHTML='<option value="all">All evidence questions</option>'+groups.map(g=>`<option value="${esc(g.question)}">${esc(g.question)} · ${indexData.pictures.filter(p=>p.pending_accession&&g.paths.includes(p.path)).length}</option>`).join('');
 $('#auditSummary').innerHTML=`<details><summary>Audit · ${groups.length} evidence questions · ${indexData.pending_count} source paths</summary><p>Approved accessions are complete. The remaining source choices are saved; this view shows what still needs evidence.</p>${auditData.deduplicated_findings.map(f=>`<p><strong>${esc(f.finding)}</strong><br>${esc(f.details)}</p>`).join('')}<p><a href="/retained/audit" target="_blank" rel="noopener">Read the full audit and exact remaining list</a> · Audit: ${esc(auditData.audited_at.slice(0,10))}</p></details>`;
}
async function openPendingPicture(p){
 if(!p.pending_accession){endPendingView(p.excluded_from_paragon?`${p.name} · excluded from Paragon. No further decision needed.`:p.state==='redundant'?`${p.name} · saved as Redundant. No further decision needed.`:'This source is not pending.');return;}
 loading=true;controls();
 try{
  const data=await api('/retained/api/case?key='+encodeURIComponent(p.case_key));
  if(!data.pending_sources?.[p.path]){p.pending_accession=null;endPendingView('This source is no longer pending.');return;}
  current=data;currentPicture={...p,read_only:true};currentPath=p.path;dirty=false;
  history.replaceState(null,'','#'+encodeURIComponent(p.path));renderList();renderPendingPicture();$('#main').scrollTop=0;
 }catch(e){$('#mainInner').innerHTML='<p class="error">'+esc(e.message)+'</p>';}
 finally{loading=false;controls();}
}
function renderPendingPicture(){
 const p=currentPicture,pending=current.pending_sources[p.path],file=current.decision?.files?.find(f=>f.path===p.path),hint=current.source_comparisons?.[p.path];
 const refs=[hint?.reference,...(current.carrier_context||[]),pending.catalogue_context].filter(Boolean);
 current.carrier_context=[...new Map(refs.map(ref=>[ref.path,ref])).values()];
 const ref=current.carrier_context[0],group=questionFor(p.path),context=hint?.reference?'Stored comparison · confirm the same physical specimen':'Catalogue context · physical identity is unconfirmed';
 $('#mainInner').innerHTML=`<div class="topline"><div><span class="eyebrow">${esc(group?.question||'PENDING EVIDENCE')}</span><h2>${esc(p.name)}</h2></div><div class="nav"><button id="previous">Previous</button><button id="next">Next</button></div></div>
 <div class="finding"><strong>${esc(group?.review_heading||'Evidence still needed')}</strong><p class="question-note">${esc(group?.review_note||pending.review_note||group?.missing_evidence)}</p><p class="subtle">Saved: ${esc(stateNames[file?.state||p.state]||p.state)}. No repeat picture choice is needed.</p></div>
 <div class="pending-comparison-controls"><div><label class="note" for="compareInventory">Compare with an archive object</label><select id="compareInventory"><option value="">Choose an existing object…</option>${indexData.catalogue.map(o=>`<option value="${esc(o.inventory)}">${esc(o.inventory)} · ${esc(o.title)}</option>`).join('')}</select></div><div><label class="note" for="archiveView">Archive view</label><select id="archiveView" aria-label="Archive view" ${current.carrier_context.length?'':'hidden'}>${current.carrier_context.map(v=>`<option value="${esc(v.path)}">${esc(v.view_label||v.inventory+' · '+(v.part||v.name))}</option>`).join('')}</select></div></div><div class="pair"><section class="column"><h3 id="archiveHeading">Already archived${ref?' · '+esc(ref.inventory):''}</h3><div class="imagebox" id="archiveImage">${imageHTML(ref)}</div><div class="caption" id="archiveCaption">${ref?esc(ref.title||ref.inventory)+masterCaption(ref,hint):''}</div><p class="subtle" id="comparisonBasis">${esc(context)}</p></section>
 <section class="column"><h3>Retained source · saved choice</h3><div class="imagebox">${imageHTML(p)}</div><div class="caption">${esc(p.name)} · ${p.width} × ${p.height} · ${esc(p.format)}</div></section></div>
 <details><summary>Source path and saved notes</summary><p><strong>Exact source:</strong> ${esc(p.path)}</p><p><strong>Archive preview:</strong> <span id="comparisonPath">${esc(ref?.path||'None selected')}</span></p>${pending.existing_catalogue_association?`<p><strong>Earlier catalogue association, unconfirmed:</strong> ${esc(pending.existing_catalogue_association)}</p>`:''}<p>${esc(file?.note||'')}</p></details>`;
 $('#compareInventory').value=ref?.inventory||'';$('#compareInventory').onchange=changePendingComparison;$('#archiveView').onchange=showCarrierView;
 $('#previous').onclick=()=>step(-1);$('#next').onclick=()=>step(1);document.querySelectorAll('[data-zoom]').forEach(el=>el.onclick=()=>zoom(el.dataset.zoom));controls();
}
async function changePendingComparison(){
 const path=currentPath,inventory=$('#compareInventory').value;if(!inventory)return;
 try{const data=await api('/retained/api/archive-views?inventory='+encodeURIComponent(inventory));
  if(currentPath!==path||$('#compareInventory').value!==inventory)return;
  current.carrier_context=data.views;$('#archiveView').hidden=!data.views.length;$('#archiveView').innerHTML=data.views.map(v=>`<option value="${esc(v.path)}">${esc(v.inventory+' · '+(v.part||v.name))}</option>`).join('');
  $('#comparisonBasis').textContent='Comparison context selected for inspection. This does not confirm identity or change the saved choice.';
  if(data.views.length){$('#archiveView').value=data.views[0].path;showCarrierView();}
  else{$('#archiveHeading').textContent='Already archived · '+inventory;$('#archiveImage').innerHTML='<div class="placeholder">No registered comparison preview for this object.</div>';$('#archiveCaption').textContent='';$('#comparisonPath').textContent='None selected';}
 }catch(e){$('#comparisonBasis').textContent=e.message;}
}
function endPendingView(message=indexData.pictures.some(p=>p.pending_accession)?'End of this evidence view.':'Review complete · no pending sources.'){
 current=null;currentPicture=null;currentPath='';dirty=false;history.replaceState(null,'',location.pathname+location.search);renderList();
 const pendingCount=indexData.pictures.filter(p=>p.pending_accession).length;
 $('#mainInner').innerHTML=`<div class="empty"><h2>${esc(message)}</h2>${pendingCount?`<p>${pendingCount} sources still await identity or ownership evidence. Their choices remain saved.</p><p>Select another question or source in the list.</p>`:'<p>All source decisions are saved. The remaining Paragon sources are recorded as redundant in the drain list. Sources excluded for other units remain excluded. No files were deleted.</p>'}</div>`;
}

function resolveLink(hash){const pictures=indexData.pictures,exact=pictures.find(p=>p.path===hash);if(exact)return exact;const original=pictures.filter(p=>p.case_key===hash);if(original.length&&!original.some(p=>p.remaining))return original[0];return pictures.find(p=>p.remaining&&p.comparison?.reference?.inventory===hash)||pictures.find(p=>p.remaining&&p.case_key===hash)||pictures.find(p=>p.case_key===hash)||pictures.find(p=>p.comparison?.reference?.inventory===hash);}
let previousFilters={search:'',match:'all',question:'all'};
async function changeFilter(){if(saving||loading)return;if(!canLeave()){for(const [id,value]of Object.entries(previousFilters))$('#'+id).value=value;return;}previousFilters=Object.fromEntries(['search','match','question'].map(id=>[id,$('#'+id).value]));renderList();if(filtered.length)await openPicture(filtered[0].path,true);else endView('No pictures in this view.');}
for(const id of ['search','match','question'])$('#'+id).onchange=changeFilter;
function zoom(path){$('#viewerLabel').textContent=path;$('#large').src=imageUrl(path,true);$('.zoomarea').classList.remove('native');$('#zoomNative').textContent='Actual preview pixels';$('#viewer').showModal();}
$('#closeViewer').onclick=()=>$('#viewer').close();$('#zoomNative').onclick=()=>{const native=$('.zoomarea').classList.toggle('native');$('#zoomNative').textContent=native?'Fit image':'Actual preview pixels';};
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
(async()=>{try{indexData=await api('/retained/api/cases');if(pendingView)await setupPendingView();const hash=decodeURIComponent(location.hash.slice(1)),requested=hash?resolveLink(hash):null;renderList();if(requested&&!requested.remaining&&!pendingView){savedView(requested);return;}const first=requested||filtered[0];if(first)await openPicture(first.path,true);else endView('No undecided pictures in this view.');}catch(e){$('#mainInner').innerHTML='<p class="error">Workbench unavailable: '+esc(e.message)+'</p>';}})();
</script>
</html>
