<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paragon · Source comparison</title>
<style>
:root{font-family:system-ui,sans-serif;color:#263b32;background:#f3f2eb;font-size:16px}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{padding:10px 15px;border:1px solid #afbbb0;border-radius:6px;background:white;color:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:default}a{color:#235b43}header{padding:20px 28px;background:#fff;border-bottom:1px solid #d5ddd3;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:23px;margin:0}header p{margin:6px 0 0;font-size:14px;color:#617365}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);max-width:1900px;margin:auto}nav{padding:20px 12px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}nav button{display:block;text-align:left;width:100%;margin-bottom:5px;border-color:transparent;background:transparent}nav button.active{background:#e0eada;border-color:#7c9a80}nav small{display:block;font-size:12px;margin-top:4px}main{padding:24px 26px;min-width:0}h2{font-size:26px;margin:8px 0}h3{font-size:17px;margin:0 0 10px}.muted{color:#657568;font-size:14px}.intro{line-height:1.55;max-width:1050px}.why{background:#fff2d1;border-left:4px solid #af8630;padding:17px 20px;margin:18px 0;line-height:1.6}.why p{margin:0}.compare-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}.current{position:sticky;top:18px}.card{background:white;border:1px solid #ced8cd;border-radius:9px;padding:17px;min-width:0;margin-bottom:18px}.card.selected{outline:3px solid #468060}.pick{display:flex;gap:10px;align-items:center;font-weight:600;line-height:1.5}.pick input{width:20px;height:20px;accent-color:#245d43;flex-shrink:0}.picture{background:#e9eae4;height:390px;display:flex;align-items:center;justify-content:center;margin:13px 0;overflow:hidden;border-radius:4px}.picture img{max-width:100%;max-height:100%;object-fit:contain}.facts{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;margin:10px 0}.facts span{background:#eef1eb;padding:4px 8px;border-radius:4px}.difference{font-size:14px;line-height:1.6}.path{font-size:12px;overflow-wrap:anywhere;line-height:1.6}details{margin-top:15px}summary{cursor:pointer}.unreadable{padding:25px;background:#fff0d9;line-height:1.6;margin:14px 0}.decision{background:#fff;border:1px solid #cbd6ca;border-radius:9px;padding:22px;margin:20px 0}.decision p{line-height:1.55}textarea{width:100%;min-height:88px;border:1px solid #acbaac;border-radius:5px;padding:11px;margin:9px 0}footer{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.primary{background:#245d43;color:white;border-color:#245d43}#message{font-size:14px;font-weight:600}#message.error{color:#a32b25}.references{margin:25px 0;border-top:2px solid #b8c7b5;padding-top:20px}.reference-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.reference-grid .picture{height:280px}dialog{width:96vw;height:94vh;max-width:1750px;border:0;border-radius:8px;background:#f3f2eb;padding:16px}dialog::backdrop{background:#000b}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.zoom{height:calc(100% - 62px);overflow:auto;text-align:center;background:#ddd}.zoom img{max-width:100%;height:auto}dialog.native .zoom img{max-width:none}.saved{color:#24623e}@media(max-width:1000px){.layout{grid-template-columns:175px minmax(0,1fr)}main{padding:20px 16px}.picture{height:300px}}@media(max-width:750px){header{padding:16px}.layout{display:block}nav{position:static;display:flex;overflow:auto;max-height:none;padding:10px}nav button{min-width:160px;margin:0 6px 0 0}.compare-grid,.reference-grid{grid-template-columns:1fr}.current{position:static}.picture{height:360px}h2{font-size:22px}}
select{font:inherit;max-width:100%;padding:10px;border:1px solid #afbbb0;border-radius:6px;background:white;color:inherit}.family-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}.family-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.family-gallery .picture{height:240px}.family-gallery .card{margin:0}.family-comparison .picture{height:400px}.family-comparison{scroll-margin-top:18px}.family-gallery h3{line-height:1.45}@media(max-width:1100px){.family-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:750px){.family-gallery{grid-template-columns:1fr}.family-comparison .picture{height:360px}}
.collection-rule{margin:0;padding:12px 28px;background:#e4eddf;border-bottom:1px solid #bacab6;line-height:1.5}.collection-rule:empty{display:none}
</style>
<header><div><h1>Paragon · Source comparison</h1><p>18 source versions · 15 review cases</p></div><span id="count" class="muted"></span></header>
<p id="carrier-rule" class="collection-rule"></p>
<div class="layout"><nav id="nav" aria-label="Objects to review"></nav><main id="main">Loading comparison…</main></div>
<dialog id="viewer"><div class="bar"><button id="closeViewer">Close</button><button id="zoomToggle">Original pixels</button><span id="viewerLabel"></span></div><div class="zoom"><img id="large" alt="Enlarged review image"></div></dialog>
<script>
let data,current=0,dirty=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function fetchData(){const r=await fetch('/api/objects');if(!r.ok)throw Error(await r.text());data=await r.json();if(!data.drain_review)throw Error('This is not the drain-candidate review.');}
function url(o,i,ref=false,member=0,full=false){return '/image?'+new URLSearchParams({inventory:o.inventory,index:i,reference:ref?'1':'0',member,full:full?'1':'0'});}
function facts(c){return `<div class="facts"><span>${esc(c.format)}</span>${c.width?`<span>${c.width} × ${c.height} pixels</span>`:''}<span>${(c.size_bytes/1e6).toFixed(2)} MB</span></div>`;}
function picture(o,c,i,ref=false,member=0){if(!c.decoded)return `<div class="unreadable"><strong>Preview unavailable</strong><p>The image reader cannot decode this file. No judgement about recoverability follows from this failure.</p></div>`;return `<div class="picture"><img src="${url(o,i,ref,member)}" alt="${esc(ref?c.archival_label:o.inventory)} · ${ref?'related reference':i===0?'current Master':o.comparison_only?'raw source':'source alternative'}${member?' · member '+(member+1):''}"></div><button data-image="${i}" data-ref="${ref?'1':'0'}" data-member="${member}">Inspect${i===0||ref?' image':' source'}${member?' '+(member+1):''}</button>`;}
function card(o,c,i){const members=c.members||[c];return `<article class="card ${o.selected_path===c.source_path?'selected':''}" data-card="${i}"><label class="pick"><input type="radio" name="master" value="${i}" ${o.selected_path===c.source_path?'checked':''} ${!c.decoded?'disabled':''}>${i===0?'Keep current Master':`Select this ${esc(c.format)} as Master`}</label><p class="muted">${i===0?(members.length>1?'One Master representation · '+members.length+' ordered members':'Already accessioned'):esc(c.label)}</p>${members.map((m,j)=>`${members.length>1?`<h3>Member ${j+1} of ${members.length}</h3>`:''}${facts(m)}${picture(o,m,i,false,j)}`).join('')}<p class="difference">${esc(c.difference)}</p><details><summary>Source path and existing evidence</summary>${members.map(m=>`<p class="path">${esc(m.source_path)}</p><p class="path">${esc(m.stored_sha256)}</p>`).join('')}${c.prior?`<p class="muted">Earlier review: ${esc(c.prior.state)}${c.prior.note?' · '+esc(c.prior.note):''}</p>`:''}${c.decode_error?`<p class="path">${esc(c.decode_error)}</p>`:''}</details></article>`;}
function bindFamilyImages(){document.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>zoom(Number(b.dataset.image),b.dataset.ref==='1',Number(b.dataset.member)));}
function familyComparison(o,i){const r=o.references[i];$('#family-target').innerHTML=`<article class="card"><h3>${i===0?'Complete carrier':'Accepted photograph Master'} · ${esc(r.archival_label)}</h3><p>${esc(r.descriptive_title)}</p>${facts(r)}${picture(o,r,i,true)}<p class="difference">${esc(r.description)}</p><details><summary>Selected Master path</summary><p class="path">${esc(r.source_path)}</p></details></article>`;bindFamilyImages();}
function sourceNote(o){if(o.accession)return o.why;return o.comparison_only?o.candidates.slice(1).map(c=>c.prior).find(p=>p?.state==='candidate'&&p.source_report==='drain-candidate-review.json'&&p.note)?.note||'':'';}
function renderFamily(o){const raw=o.candidates[1],note=sourceNote(o),carrier=o.references[0],photoCount=o.references.length-1,sourceName=raw.source_path.split('/').pop();$('#main').innerHTML=`<p class="muted">${esc(o.inventory)} source review · carrier and supporting images</p><h2>${esc(carrier.archival_label)} · Carrier and supporting images</h2><section class="why"><h3>${o.accession?'Accessioned as a section of '+esc(o.accession.inventory):note?'Preservation note recorded · existing Masters retained':'Existing Masters retained · raw scan unresolved'}</h3><p>${esc(o.why)}</p></section><div class="family-toolbar"><label for="family-reference">Compare the source with</label><select id="family-reference">${o.references.map((r,i)=>`<option value="${i}">${esc(r.archival_label)} · ${i===0?'Complete carrier':esc(r.descriptive_title)}</option>`).join('')}</select></div><div class="compare-grid family-comparison"><section class="current" aria-label="Retained source image"><article class="card"><h3>Source image · ${esc(sourceName)}</h3><p class="muted">${o.accession?'Full scan accessioned with carrier '+esc(o.accession.inventory):note?'Preserve source content · archive placement pending':'Different coverage · retained for review'}</p>${facts(raw)}${picture(o,raw,1)}<details><summary>Source path and earlier evidence</summary><p class="path">${esc(raw.source_path)}</p><p class="path">${esc(raw.stored_sha256)}</p>${o.accession?`<p class="path">Accessioned carrier member: ${esc(o.accession.master_path)}</p>`:''}<p class="muted">${note?'The earlier redundant classification has been superseded in the work decisions.':'The earlier redundant classification is under review. A choice between different views cannot confirm it.'}</p></details></article></section><section id="family-target" aria-label="Carrier or accepted photograph"></section></div>${photoCount?`<section class="references"><h3>${photoCount} supporting photographs · accepted Masters</h3><p class="muted">Choose a supporting photograph to compare its content with the source above.</p><div class="family-gallery">${o.references.slice(1).map((r,i)=>`<article class="card"><h3>${esc(r.archival_label)} · ${esc(r.descriptive_title)}</h3><p class="muted">Accepted Master</p>${picture(o,r,i+1,true)}<div class="family-toolbar"><button data-family="${i+1}">Compare ${esc(r.archival_label)}</button></div></article>`).join('')}</div></section>`:''}<section class="decision"><h3>${o.accession?'Accession completed · Vladimir':note?'Preservation note · Vladimir':'Raw scan remains unresolved'}</h3><p>${esc(note||'Its content must be accounted for before deciding redundancy. No source or selected Master is changed by this comparison.')}</p><footer><button id="previous" ${current===0?'disabled':''}>← Previous</button><button id="next" ${current===data.objects.length-1?'disabled':''}>Next object →</button></footer></section>`;
familyComparison(o,0);$('#family-reference').onchange=e=>familyComparison(o,Number(e.target.value));document.querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>{$('#family-reference').value=b.dataset.family;familyComparison(o,Number(b.dataset.family));$('.family-comparison').scrollIntoView({block:'start'});});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(Number(b.dataset.nav)));$('#previous').onclick=()=>navigate(current-1);$('#next').onclick=()=>navigate(current+1);}
function markDirty(){dirty=true;$('#message').textContent='Unsaved choice';$('#message').classList.remove('error');}
function navigate(i){if(dirty&&!confirm('Discard the unsaved choice for this object?'))return;current=i;dirty=false;render();window.scrollTo(0,0);}
function render(){const o=data.objects[current],rule=data.carrier_rule;$('#carrier-rule').textContent=rule?`Collection rule: preserve every carrier and its supporting images. ${rule.carrier_count} carriers · ${rule.catalogued_supporting_images} catalogued supporting photographs · ${rule.removed_from_proposed_redundant_paths.length} source paths removed from proposed redundancy.`:'';$('#count').textContent=data.objects.filter(x=>x.decision&&!x.comparison_only).length+' / '+data.objects.filter(x=>!x.comparison_only).length+' reviewed · '+data.objects.filter(x=>x.comparison_only&&x.accession).length+' carrier sections accessioned';$('#nav').innerHTML=data.objects.map((x,i)=>`<button class="${i===current?'active':''}" data-nav="${i}">${esc(x.inventory)}<small>${esc(x.comparison_only?(x.accession?'Accessioned with '+x.accession.inventory:sourceNote(x)?'Preservation note saved':'Raw scan unresolved'):x.status)} · ${x.candidates.length-1} source${x.candidates.length>2?'s':''}</small></button>`).join('');
if(o.comparison_only){renderFamily(o);return;}
$('#main').innerHTML=`<p class="muted">Object ${current+1} of ${data.objects.length} · ${esc(o.inventory)}</p><h2>${esc(o.catalogue.descriptive_title||o.inventory)}</h2><p class="intro">${esc(o.catalogue.description)}</p><section class="why"><h3>What could be lost</h3><p>${esc(o.why)}</p></section><div class="compare-grid"><section class="current" aria-label="Current Master">${card(o,o.candidates[0],0)}</section><section aria-label="Source alternatives">${o.candidates.slice(1).map((c,i)=>card(o,c,i+1)).join('')}</section></div>${o.references.length?`<section class="references"><h3>Related objects · comparison only</h3><p class="muted">These references help identify the content. They are not Master choices for this object.</p><div class="reference-grid">${o.references.map((r,i)=>`<article class="card"><h3>${esc(r.archival_label)} · ${esc(r.descriptive_title)}</h3>${facts(r)}${picture(o,r,i,true)}<p class="difference">${esc(r.description)}</p></article>`).join('')}</div></section>`:''}<section class="decision"><h3>Decision for ${esc(o.inventory)}</h3><label class="pick"><input type="radio" name="master" value="" ${!o.selected_path?'checked':''}>Leave unresolved</label><p class="muted">Keep the current Master to confirm the other shown sources as redundant, or select one alternative. If extra content should be retained or the identity needs fixing, leave unresolved and explain below. Redundancy does not authorize deletion.</p><label for="note">Short note</label><textarea id="note" maxlength="2000" placeholder="What should be retained, or why is the alternative redundant?">${esc(o.note)}</textarea><p class="muted">Saved choices remain in the work area. The accessioned archive and USB files remain unchanged.</p><footer><button id="save" class="primary">Save decision</button><button id="previous" ${current===0?'disabled':''}>← Previous</button><button id="next" ${current===data.objects.length-1?'disabled':''}>Next object →</button><span id="message" role="status">${o.decision?'Saved decision loaded':''}</span></footer></section>`;
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(Number(b.dataset.nav)));document.querySelectorAll('input[name=master]').forEach(r=>r.onchange=()=>{markDirty();document.querySelectorAll('[data-card]').forEach(c=>c.classList.toggle('selected',c.dataset.card===r.value));});document.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>zoom(Number(b.dataset.image),b.dataset.ref==='1',Number(b.dataset.member)));$('#note').oninput=markDirty;$('#save').onclick=save;$('#previous').onclick=()=>navigate(current-1);$('#next').onclick=()=>navigate(current+1);}
function zoom(i,ref,member){const o=data.objects[current];$('#large').src=url(o,i,ref,member,true);$('#viewerLabel').textContent=ref?o.references[i].archival_label:o.inventory+' · '+(i===0?'current Master':'alternative '+i)+(!ref&&o.candidates[i].members?.length>1?' · member '+(member+1):'');$('#viewer').classList.remove('native');$('#zoomToggle').textContent='Original pixels';$('#viewer').showModal();}
$('#closeViewer').onclick=()=>$('#viewer').close();$('#zoomToggle').onclick=()=>{const native=$('#viewer').classList.toggle('native');$('#zoomToggle').textContent=native?'Fit image':'Original pixels';};
async function save(){const o=data.objects[current],selected=$('input[name=master]:checked').value;$('#save').disabled=true;$('#message').classList.remove('error');try{const r=await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':data.token},body:JSON.stringify({inventory:o.inventory,selected_master_path:selected===''?'':o.candidates[Number(selected)].source_path,note:$('#note').value,previous_review:o.decision?.reviewed_at||''})});const result=await r.json();if(!r.ok)throw Error(result.error);await fetchData();dirty=false;render();$('#message').textContent='Decision saved';}catch(e){$('#message').textContent=e.message;$('#message').classList.add('error');$('#save').disabled=false;}}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});fetchData().then(render).catch(e=>{$('#main').textContent='Review unavailable: '+e.message;});
</script></html>
